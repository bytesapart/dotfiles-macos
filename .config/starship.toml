# Starship prompt - Catppuccin Mocha
# https://starship.rs/config/  (palette: https://github.com/catppuccin/catppuccin)
"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_mocha"
add_newline = false
command_timeout = 1000
continuation_prompt = "[∙](overlay1) "

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$git_metrics\
$fill\
$cmd_duration\
$jobs\
$status\
$time\
$line_break\
$python\
$rust\
$nodejs\
$golang\
$c\
$cpp\
$lua\
$zig\
$package\
$docker_context\
$kubernetes\
$character"""

[os]
disabled = false
style = "bold overlay2"
format = "[$symbol ]($style)"

[username]
show_always = false
style_user = "bold lavender"
format = "[$user]($style) "

[hostname]
ssh_only = true
style = "bold mauve"
format = "[@$hostname]($style) "

[directory]
style = "bold blue"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "red"
format = "[$path]($style)[$read_only]($read_only_style) "
[directory.substitutions]
"~/code" = "󰲋 "
"~/Documents" = "󰈙 "
"~/Downloads" = "󰉍 "

[git_branch]
style = "bold mauve"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_commit]
commit_hash_length = 7
tag_disabled = false
only_detached = false
style = "bold teal"
format = "[\\($hash$tag\\)]($style) "

[git_status]
style = "bold yellow"
format = "([\\[$all_status$ahead_behind\\]]($style) )"
conflicted = "󰘬 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
up_to_date = ""
untracked = "?${count} "
stashed = "󰏗 "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[git_metrics]
disabled = false
added_style = "bold green"
deleted_style = "bold red"
format = '([+$added]($added_style)) ([-$deleted]($deleted_style)) '

[fill]
symbol = " "

[cmd_duration]
min_time = 2_000
style = "yellow"
format = "[took $duration]($style) "

[jobs]
symbol = "󰒓 "
style = "bold peach"
format = "[$symbol$number]($style) "

[status]
disabled = false
symbol = "✘"
success_symbol = ""
style = "bold red"
format = "[$symbol $status]($style) "

[time]
disabled = false
time_format = "%T"
style = "overlay1"
format = "[󰥔 $time]($style)"

# Languages: shown only inside matching projects (default detection).
[python]
style = "bold yellow"
format = "[${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"

[rust]
style = "bold peach"
format = "[$symbol($version )]($style)"

[nodejs]
style = "bold green"
format = "[$symbol($version )]($style)"

[golang]
style = "bold sky"
format = "[$symbol($version )]($style)"

[c]
style = "bold sapphire"
format = "[$symbol($version )]($style)"

[cpp]
style = "bold sapphire"
format = "[$symbol($version )]($style)"

[lua]
style = "bold blue"
format = "[$symbol($version )]($style)"

[zig]
style = "bold yellow"
format = "[$symbol($version )]($style)"

[package]
symbol = "󰏗 "
style = "bold overlay2"
format = "[$symbol$version]($style) "

[docker_context]
style = "bold blue"
only_with_files = true
format = "[$symbol$context]($style) "

[kubernetes]
disabled = false
symbol = "󱃾 "
style = "bold sapphire"
format = "[$symbol$context( \\($namespace\\))]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold lavender)"

[battery]
disabled = true

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
