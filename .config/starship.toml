# Starship prompt - Catppuccin Mocha, powerline segments
# https://starship.rs/config/  (palette: https://github.com/catppuccin/catppuccin)
"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_mocha"
add_newline = false
command_timeout = 1000
continuation_prompt = "[∙](overlay1) "

# Left-hand powerline: [os/user] [directory] [git] [languages] [infra] [time]
# Each segment has a background color; the  glyphs transition between them.
format = """
[](fg:surface0)\
$os\
$username\
$hostname\
[](bg:peach fg:surface0)\
$directory\
[](bg:green fg:peach)\
$git_branch\
$git_commit\
$git_state\
$git_status\
$git_metrics\
[](bg:teal fg:green)\
$python\
$rust\
$nodejs\
$golang\
$c\
$cpp\
$lua\
$zig\
$package\
[](bg:blue fg:teal)\
$docker_context\
$kubernetes\
[](bg:lavender fg:blue)\
$cmd_duration\
$jobs\
$status\
$time\
[](fg:lavender)\
$line_break\
$character"""

[os]
disabled = false
style = "bg:surface0 fg:text"
format = "[$symbol ]($style)"

[os.symbols]
Macos = ""

[username]
show_always = false
style_user = "bg:surface0 fg:text"
style_root = "bg:surface0 fg:red"
format = "[$user ]($style)"

[hostname]
ssh_only = true
style = "bg:surface0 fg:text"
format = "[@$hostname ]($style)"

[directory]
style = "bg:peach fg:crust"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "bg:peach fg:red"
format = "[ $path ]($style)[$read_only ]($read_only_style)"
[directory.substitutions]
"~/code" = "󰲋 code"
"~/Documents" = "󰈙 docs"
"~/Downloads" = "󰉍 dl"

[git_branch]
style = "bg:green fg:crust"
format = "[ $symbol$branch(:$remote_branch) ]($style)"

[git_commit]
commit_hash_length = 7
tag_disabled = false
only_detached = false
style = "bg:green fg:crust"
format = "[\\($hash$tag\\) ]($style)"

[git_state]
style = "bg:green fg:crust"
format = "([$state( $progress_current/$progress_total)]($style) )"

[git_status]
style = "bg:green fg:crust"
format = "([\\[$all_status$ahead_behind\\] ]($style))"
conflicted = "󰘬 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
up_to_date = ""
untracked = "?${count} "
stashed = "󰏗 "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[git_metrics]
disabled = false
added_style = "bg:green fg:crust"
deleted_style = "bg:green fg:crust"
format = '([+$added ]($added_style))([-$deleted ]($deleted_style))'

# Languages: shown only inside matching projects (default detection).
[python]
style = "bg:teal fg:crust"
format = "[ $symbol${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"

[rust]
style = "bg:teal fg:crust"
format = "[ $symbol($version )]($style)"

[nodejs]
style = "bg:teal fg:crust"
format = "[ $symbol($version )]($style)"

[golang]
style = "bg:teal fg:crust"
format = "[ $symbol($version )]($style)"

[c]
style = "bg:teal fg:crust"
format = "[ $symbol($version )]($style)"

[cpp]
style = "bg:teal fg:crust"
format = "[ $symbol($version )]($style)"

[lua]
style = "bg:teal fg:crust"
format = "[ $symbol($version )]($style)"

[zig]
style = "bg:teal fg:crust"
format = "[ $symbol($version )]($style)"

[package]
symbol = "󰏗 "
style = "bg:teal fg:crust"
format = "[ $symbol$version ]($style)"

[docker_context]
style = "bg:blue fg:crust"
only_with_files = true
format = "[ $symbol$context ]($style)"

[kubernetes]
disabled = false
symbol = "󱃾 "
style = "bg:blue fg:crust"
format = "[ $symbol$context( \\($namespace\\)) ]($style)"

[cmd_duration]
min_time = 2_000
style = "bg:lavender fg:crust"
format = "[ took $duration ]($style)"

[jobs]
symbol = "󰒓 "
style = "bg:lavender fg:crust"
format = "[ $symbol$number ]($style)"

[status]
disabled = false
symbol = "✘"
success_symbol = ""
style = "bg:lavender fg:red"
format = "[ $symbol $status ]($style)"

[time]
disabled = false
time_format = "%T"
style = "bg:lavender fg:crust"
format = "[ 󰥔 $time ]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold lavender)"

[battery]
disabled = true

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
